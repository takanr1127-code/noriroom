<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>七色のHello World</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171722; color: white; font-family: system-ui, sans-serif; }
    main { text-align: center; padding: 24px; }
    button { padding: 14px 28px; border: none; border-radius: 12px; background: white; color: #171722; font-size: 18px; cursor: pointer; }
    button:hover { background: #e8e8f0; }
    button:focus-visible { outline: 3px solid #65cfff; outline-offset: 5px; }
    #message { min-height: 1.5em; margin-top: 32px; font-size: clamp(36px, 8vw, 72px); font-weight: 800; line-height: 1.5; background: linear-gradient(to right, #ff6060 0%, #ffab40 16.67%, #ffe761 33.33%, #65df85 50%, #65cfff 66.67%, #8c8cff 83.33%, #db85ff 100%); background-clip: text; -webkit-background-clip: text; color: transparent; }
  </style>
</head>
<body>
  <main>
    <button id="showButton" type="button">押してみて！</button>
    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <script>
    document.getElementById("showButton").addEventListener("click", () => {
      document.getElementById("message").textContent = "hello world";
    });
  </script>
</body>
</html>
